<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Εγγραφή - CaReMind</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="register.css" />
  <link rel="stylesheet" href="ui.css" />
    <script src="ui.js?v=20260814-3"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-form">

      <!-- SIGNUP -->
      <div id="signupBlock">
        <h3 class="reg-title">Δημιουργία Λογαριασμού</h3>
        <form id="registerForm">
          <div class="form-group">
            <input type="text" id="newUsername" required placeholder="Όνομα Χρήστη" />
          </div>

          <div class="form-group">
            <input type="email" id="userEmail" required placeholder="Email" />
          </div>

          <div class="form-group">
            <select id="accountType" required onchange="toggleCompanyField()">
              <option value="individual">Ιδιώτης</option>
              <option value="company">Εταιρία</option>
            </select>
          </div>

          <div class="form-group" id="companyFieldWrapper" style="display: none;">
            <input type="text" id="companyName" placeholder="Όνομα Εταιρίας" />
          </div>
          <div class="form-group">
            <input type="text" id="userNumber" placeholder="Αριθμός Κινητού" />
          </div>

          <div class="form-group password-group">
  <input type="password" id="newPassword" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Κωδικός (τουλάχιστον 8 χαρακτήρες)" />
  <button type="button" class="toggle-pass" data-target="newPassword" aria-label="Εμφάνιση κωδικού">
    <img class="toggle-icon" src="eye.png" alt="" />
  </button>
</div>

<div class="form-group password-group">
  <input type="password" id="regPassword" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Επιβεβαίωση Κωδικού" />
  <button type="button" class="toggle-pass" data-target="regPassword" aria-label="Εμφάνιση κωδικού">
    <img class="toggle-icon" src="eye.png" alt="" />
  </button>
</div>
<p id="passMatchMsg" class="pass-msg" style="display:none;"></p>

          

          <button type="submit" class="btn-primary">Δημιουργία λογαριασμού</button>

          <p class="reg-message" id="registerMsg" style="display:none"></p>
        </form>

        <div class="reg-footer">
          <a href="index.html">Έχω ήδη λογαριασμό</a>
        </div>
      </div>

      <!-- VERIFY -->
      <div id="verifyBlock" style="display:none">
        <h2 class="reg-title">Επιβεβαίωση Email</h2>
        <p class="reg-hint">Στείλαμε έναν 6-ψήφιο κωδικό στο email σας. Ο κωδικός λήγει σε 5 λεπτά.</p>

        <form id="verifyForm">
          <div class="form-group">
            <label for="verEmail">Email</label>
            <input type="email" id="verEmail" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="verCode">Κωδικός</label>
            <input type="text" id="verCode" inputmode="numeric" maxlength="6" required placeholder="000000" />
          </div>

          <button type="submit" class="btn-primary">Επιβεβαίωση</button>

          <div class="verify-actions">
            <button type="button" class="btn-link" id="resendBtn">Αποστολή ξανά</button>
            <a class="btn-link" href="index.html">Πίσω στο login</a>
          </div>

          <p class="reg-message" id="verifyMsg" style="display:none"></p>
        </form>
      </div>
    </div>
  </div>

    <script src="api.js?v=20260816-1"></script>
  <script src="register.js"></script>
</body>
</html>
