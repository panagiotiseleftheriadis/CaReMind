<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Σύνδεση - CaReMind</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="ui.css" />
    <script src="ui.js"></script>
    <script>
      document.documentElement.classList.add("js");
      window.__caremindIntroFallback = window.setTimeout(function () {
        if (!document.body) return;
        document.body.classList.add("intro-complete");
        document.body.classList.remove("is-intro");
        document.querySelectorAll("[data-intro-credential]").forEach(function (field) {
          field.disabled = false;
        });
        window.setTimeout(function () {
          document.getElementById("introScreen")?.remove();
        }, 850);
      }, 4000);
    </script>
    <link rel="stylesheet" href="login.css" />
    <style>
      .admin-link {
        text-align: center;
        margin-top: 20px;
        border-top: 1px solid #ddd;
        padding-top: 15px;
      }
      .admin-link a {
        color: #666;
        text-decoration: none;
        font-size: 14px;
      }
      .admin-link a:hover {
        color: #007bff;
      }
    </style>
  </head>
  <body class="login-body is-intro">
    <div class="intro-screen" id="introScreen" aria-hidden="true">
      <div class="intro-grid"></div>
      <div class="intro-glow intro-glow-left"></div>
      <div class="intro-glow intro-glow-right"></div>

      <div class="intro-brand">
        <div class="intro-car" aria-hidden="true">
          <svg viewBox="0 0 220 82" role="presentation">
            <path
              class="intro-car-line"
              d="M18 58h13l9-24c2-6 7-10 14-11l76-7c12-1 23 3 32 11l18 17 20 5c7 2 11 7 11 14v2h-13"
            />
            <path class="intro-car-line intro-car-line-delayed" d="M78 23 65 44h92l-23-27" />
            <path class="intro-car-line" d="M62 65h90" />
            <circle class="intro-wheel" cx="48" cy="63" r="13" />
            <circle class="intro-wheel" cx="174" cy="63" r="13" />
          </svg>
        </div>
        <img class="intro-logo" src="logo.svg" alt="" />
        <p class="intro-tagline">Mind your car.</p>
        <div class="intro-progress" aria-hidden="true"><span></span></div>
      </div>

      <p class="intro-skip">Πατήστε για παράλειψη</p>
    </div>

    <div class="login-container">
      <div class="login-form">
        <div class="logo-wrapper">
          <img src="logo.svg" alt="CaReMind" />
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Όνομα Χρήστη ή Email:</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              data-intro-credential
              disabled
              required
              placeholder="Συμπληρώστε username ή email"
            />
          </div>

          <div class="form-group">
            <label for="password">Κωδικός Πρόσβασης:</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                data-intro-credential
                disabled
                required
                placeholder="Συμπληρώστε κωδικό"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="password"
                aria-label="Εμφάνιση/Απόκρυψη κωδικού"
              >
                <img src="eye.png" alt="Εμφάνιση κωδικού" class="eye-icon" />
              </button>
            </div>
          </div>
          <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">Ξεχάσατε τον κωδικό σας;</a>
          </div>
          <button type="submit" class="btn-primary">Σύνδεση</button>

          <div class="demo-entry">
            <span>ή</span>
            <button type="button" class="btn-demo" id="demoLoginBtn">
              <span class="demo-status" aria-hidden="true"></span>
              <span class="demo-label">Demo Λειτουργία</span>
              <span class="demo-arrow" aria-hidden="true">→</span>
            </button>
          </div>

          <div class="interest-link" style="text-align: center; margin-top: 12px">
            <p style="color: #666; font-size: 14px">
              Δεν έχετε λογαριασμό;
              <a href="register.html" style="color: #007bff">Εγγραφή</a>
            </p>
          </div>

          <div id="loginError" class="login-message error">
            Λάθος στοιχεία εισόδου. Παρακαλώ προσπαθήστε ξανά.
          </div>
          <div
            class="interest-link"
            style="text-align: center; margin-top: 15px"
          >
            
          </div>
        </form>
      </div>
    </div>

    <script src="intro.js"></script>
    <script src="demo-store.js"></script>
    <script src="api.js"></script>
    <script src="auth-guard.js"></script>
    <script src="auth.js"></script>

    <!-- Forgot password modal -->
    <div class="modal" id="forgotModal" aria-hidden="true" inert>
      <div class="modal-content" role="dialog" aria-modal="true">
        <button type="button" class="modal-close" id="forgotClose" aria-label="Κλείσιμο">
          ×
        </button>

        <h3>Επαναφορά κωδικού</h3>

        <!-- Step 1: email -->
        <div class="fp-step" id="fpStepEmail">
          <p>Συμπληρώστε το email σας.</p>
          <div class="form-group">
            <input type="email" id="fpEmail" placeholder="Διεύθυνση email" />
            <p id="fpEmailError" class="form-error"></p>
          </div>
          <button type="button" class="btn-primary" id="fpSendCode">Αποστολή κωδικού</button>
        </div>

        <!-- Step 2: code -->
        <div class="fp-step" id="fpStepCode" style="display: none">
          <p>Σας έχει σταλθεί ένας 6-ψήφιος κωδικός στο email σας.</p>
          <div class="form-group">
            <label for="fpCode">Κωδικός Επιβεβαίωσης:</label>
            <input
              type="text"
              id="fpCode"
              inputmode="numeric"
              maxlength="6"
              
            />
          </div>
          <button type="button" class="btn-primary" id="fpVerifyCode">Επιβεβαίωση</button>
        </div>

        <!-- Step 3: new password -->
        <div class="fp-step" id="fpStepReset" style="display: none">
          <p>Συμπληρώστε τον νεό σας κωδικό:</p>
          <div class="form-group">
            <input type="password" id="fpNewPass" placeholder="Νέος κωδικός" aria-label="Νέος κωδικός" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="fpNewPass2"
              placeholder="Επιβεβαίωση κωδικού"
              aria-label="Επιβεβαίωση νέου κωδικού"
              autocomplete="new-password"
            />
          </div>
          <button type="button" class="btn-primary" id="fpDoReset">Αλλαγή κωδικού</button>
        </div>

        <div class="fp-message" id="fpMsg" style="display: none"></div>
      </div>
    </div>
  </body>
</html>
